name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    name: Lint and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # 모노레포 루트에서 전체 워크스페이스 설치(#883).
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --workspace apps/mustard

      - name: Build
        run: npm run build --workspace apps/mustard

      # 누노피 단독 앱(apps/nunopi) — 같은 패키지를 쓰므로 머스타드만 빌드하면 표류함(#1116). 누노피 레포 동기화 전 검증.
      - name: Lint (nunopi standalone)
        run: npm run lint --workspace apps/nunopi

      - name: Build (nunopi standalone)
        run: npm run build --workspace apps/nunopi
