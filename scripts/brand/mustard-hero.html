<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{font-family:-apple-system,"SF Pro Display","Helvetica Neue",Inter,sans-serif;color:#f4efe2;position:relative;
 background:radial-gradient(700px 360px at 50% 18%,rgba(212,160,23,.22),transparent 70%),radial-gradient(900px 500px at 50% 120%,rgba(212,160,23,.12),transparent 60%),linear-gradient(180deg,#141418 0%,#0a0a0c 100%)}

.head{position:absolute;left:0;right:0;top:44px;display:flex;flex-direction:column;align-items:center;text-align:center;z-index:2}

.icon{width:92px;height:92px;filter:drop-shadow(0 16px 36px rgba(212,160,23,.35))}

.tag{margin-top:16px;font-size:16px;font-weight:700;letter-spacing:7px;text-transform:uppercase;color:#f4efe2}
.tag span{color:#d4a017}
p.sub{margin-top:12px;font-size:20px;color:#c9c3b4}
.stage{position:absolute;left:50%;top:300px;width:980px;height:615px;margin-left:-490px;perspective:2000px;z-index:1}
.shot{width:100%;height:100%;border-radius:16px;overflow:hidden;border:1px solid rgba(255,255,255,.14);

 box-shadow:0 60px 120px rgba(0,0,0,.7),0 0 0 1px rgba(0,0,0,.5),0 -10px 80px rgba(212,160,23,.18)}
.shot img{display:block;width:100%;height:100%}
.fade{position:absolute;left:0;right:0;bottom:0;height:150px;background:linear-gradient(180deg,transparent,#0a0a0c 85%);z-index:3}
