<!doctype html><html><head><meta charset="utf-8"><title>Mustard hero</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{font-family:-apple-system,"SF Pro Display","Helvetica Neue",Inter,sans-serif;color:#f4efe2;position:relative;background:#0a0a0c}
.stage{position:absolute;inset:0;perspective:900px;perspective-origin:50% 0%;overflow:hidden}
.shot{position:absolute;left:50%;bottom:-6px;width:1150px;height:722px;margin-left:-575px;border-radius:18px;overflow:hidden;transform:rotateX(36deg);transform-origin:50% 100%;opacity:.95;border:1px solid rgba(255,255,255,.14);box-shadow:0 0 140px rgba(212,160,23,.2)}
.shot img{display:block;width:100%;height:100%}
/* hide the app behind the text; let it show only around it */
.veil{position:absolute;inset:0;background:
 radial-gradient(440px 50px at 50% 243px,rgba(10,10,12,.95) 0%,rgba(10,10,12,.9) 68%,transparent 100%),
 radial-gradient(500px 175px at 50% 26%,rgba(10,10,12,.97) 0%,rgba(10,10,12,.93) 62%,rgba(10,10,12,.5) 84%,transparent 100%),
 linear-gradient(180deg,rgba(10,10,12,.55) 0%,rgba(10,10,12,.15) 30%,transparent 55%,rgba(10,10,12,.25) 100%)}
.glow{position:absolute;inset:0;background:radial-gradient(520px 220px at 50% 26%,rgba(212,160,23,.16),transparent 70%)}
.head{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;padding-top:58px}
.row{display:flex;align-items:center;gap:24px}
.icon{width:100px;height:100px;filter:drop-shadow(0 16px 40px rgba(212,160,23,.4))}
h1{font-size:118px;font-weight:800;letter-spacing:-4.5px;line-height:1;background:linear-gradient(180deg,#ffe08a,#d4a017 70%,#b7860f);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 6px 24px rgba(0,0,0,.6))}
.tag{margin-top:20px;font-size:17px;font-weight:700;letter-spacing:8px;text-transform:uppercase;color:#f4efe2}
.tag span{color:#d4a017}
p.sub{margin-top:14px;font-size:21px;color:#d6d0c1;text-shadow:0 2px 12px rgba(0,0,0,.9)}
</style></head><body>
