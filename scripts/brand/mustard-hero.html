<!doctype html><html><head><meta charset="utf-8"><title>Mustard hero</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{font-family:-apple-system,"SF Pro Display","Helvetica Neue",Inter,sans-serif;color:#f4efe2;
 background:radial-gradient(900px 520px at 22% 38%,rgba(212,160,23,.20),transparent 60%),
 radial-gradient(700px 500px at 95% 110%,rgba(212,160,23,.10),transparent 60%),linear-gradient(160deg,#16161b 0%,#0b0b0d 70%);position:relative}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:40px 40px;mask-image:radial-gradient(800px 500px at 30% 45%,#000 30%,transparent 80%)}
.left{position:absolute;left:52px;top:0;bottom:0;width:372px;display:flex;flex-direction:column;justify-content:center}
.icon{width:84px;height:84px;filter:drop-shadow(0 18px 40px rgba(212,160,23,.28));margin-bottom:24px}
h1{font-size:62px;font-weight:800;letter-spacing:-3px;line-height:1;background:linear-gradient(180deg,#ffe08a,#d4a017 70%,#b7860f);-webkit-background-clip:text;color:transparent}
.tag{margin-top:14px;font-size:12.5px;font-weight:600;letter-spacing:4px;text-transform:uppercase;color:#d4a017}
.tag b{color:#f4efe2;font-weight:700}
p.sub{margin-top:18px;font-size:17px;line-height:1.5;color:#c9c3b4;font-weight:400}
.chips{margin-top:26px;display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:11.5px;padding:5px 10px;border-radius:999px;border:1px solid rgba(212,160,23,.35);color:#e8d9ad;background:rgba(212,160,23,.07)}
/* window */
.win{position:absolute;left:560px;top:84px;width:600px;height:462px;border-radius:14px;background:#121218;border:1px solid rgba(255,255,255,.09);
 box-shadow:0 40px 90px rgba(0,0,0,.6),0 0 0 1px rgba(0,0,0,.4),0 0 80px rgba(212,160,23,.08);overflow:hidden;transform:perspective(1600px) rotateY(-6deg) rotateX(2deg);transform-origin:left center}
.bar{height:34px;display:flex;align-items:center;gap:7px;padding:0 13px;background:#17171e;border-bottom:1px solid rgba(255,255,255,.06)}
.dot{width:11px;height:11px;border-radius:50%}
.tab{margin-left:14px;font-size:11.5px;color:#cfc8b6;background:#22222b;padding:5px 11px;border-radius:7px;display:flex;align-items:center;gap:6px}
.tab i{width:7px;height:7px;border-radius:50%;background:#d4a017;display:inline-block}
.tab.dim{background:transparent;color:#77727f;margin-left:2px}
.body{display:flex;height:calc(100% - 34px)}
.rail{width:40px;background:#101015;border-right:1px solid rgba(255,255,255,.05);display:flex;flex-direction:column;align-items:center;gap:14px;padding-top:14px}
.rail span{width:16px;height:16px;border-radius:4px;border:1.6px solid #5d5966}
.rail span.on{border-color:#d4a017;background:rgba(212,160,23,.15)}
.term{flex:1.05;padding:14px 16px;font-family:"SF Mono",Menlo,monospace;font-size:11.6px;line-height:1.75;color:#b9b3a6;border-right:1px solid rgba(255,255,255,.05)}
.term .p{color:#d4a017}.term .ok{color:#8bd17c}.term .dim{color:#6e6977}.term .hl{color:#f4efe2}
.cur{display:inline-block;width:7px;height:13px;background:#d4a017;vertical-align:-2px}
.side{flex:1;display:flex;flex-direction:column}
.pane{padding:12px 13px;border-bottom:1px solid rgba(255,255,255,.05)}
.h{font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:#7c7786;margin-bottom:9px;display:flex;align-items:center;gap:6px}
.h b{width:6px;height:6px;border-radius:50%;background:#d4a017}
.cols{display:flex;gap:7px}
.col{flex:1;display:flex;flex-direction:column;gap:6px}
.col small{font-size:9.5px;color:#6e6977;margin-bottom:1px}
.card{font-size:10px;line-height:1.35;color:#d9d3c4;background:#1b1b23;border:1px solid rgba(255,255,255,.07);border-radius:6px;padding:6px 7px}
.card.run{border-color:rgba(212,160,23,.55);box-shadow:0 0 0 1px rgba(212,160,23,.15)}
.card em{display:block;font-style:normal;font-size:9px;color:#9a93a3;margin-top:3px}
.card.run em{color:#e8b93a}
.chat{display:flex;flex-direction:column;gap:7px}
.msg{display:flex;gap:7px;align-items:flex-start}
.av{width:18px;height:18px;border-radius:6px;flex:none}
.bub{font-size:10px;line-height:1.4;color:#d9d3c4;background:#1d1d26;border-radius:4px 9px 9px 9px;padding:5px 8px}
.bub .m{color:#e8b93a}
.git{padding:12px 13px;flex:1}
svg.g{width:100%;height:70px}
.shot{position:absolute;left:452px;top:96px;width:712px;height:447px;border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,.12);box-shadow:0 30px 80px rgba(0,0,0,.65),0 0 0 1px rgba(0,0,0,.5),0 0 90px rgba(212,160,23,.12)}
.shot img{display:block;width:100%;height:100%}
</style></head><body><div class="grid"></div>

 3 0 9 Z" transform="rotate(90)"/><path d="M0 9 C-7 3 -8 -9 0 -15 C8 -9 7 3 0 9 Z" transform="rotate(180)"/><path d="M0 9 C-7 3 -8 -9 0 -15 C8 -9 7 3 0 9 Z" transform="rotate(270)"/></g><circle cx="0" cy="0" r="4.5" fill="#f0c445"/></g><g transform="translate(60 54) scale(0.6)"><g fill="url(#g)"><path d="M0 9 C-7 3 -8 -9 0 -15 C8 -9 7 3 0 9 Z" transform="rotate(0)"/><path d="M0 9 C-7 3 -8 -9 0 -15 C8 -9 7 3 0 9 Z" transform="rotate(90)"/><path d="M0 9 C-7 3 -8 -9 0 -15 C8 -9 7 3 0 9 Z" transform="rotate(180)"/><path d="M0 9 C-7 3 -8 -9 0 -15 C8 -9 7 3 0 9 Z" transform="rotate(270)"/></g><circle cx="0" cy="0" r="4.5" fill="#f0c445"/></g></g></svg>
</div>
