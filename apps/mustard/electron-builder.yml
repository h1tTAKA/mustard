appId: ai.neuradex.mustard
productName: Mustard
# hoist 모노레포라 electron이 앱 로컬 node_modules에 없음 → 범위 해석 불가. 설치본과 동일하게 고정(#898).
electronVersion: 43.7.0
directories:
  output: dist_electron
  buildResources: build

# asar에 들어갈 것. node_modules/** 글로빙 금지(#684 OOM + 모노레포 hoist).
# electron-builder가 package.json dependencies에서 prod deps를 자동 수집(hoist된 루트 node_modules 해석).
files:
  - electron/**
  - package.json

# asar 비활성(#898). SNA 런타임 서버는 ELECTRON_RUN_AS_NODE(순수 node) 자식으로 fork되는데,
# 순수 node는 asar를 못 읽어 server/standalone.js + 그 deps 로드에 실패한다(fork 즉사, code=1).
# @sna-sdk/core만 asarUnpack해도 서버의 다른 deps는 asar에 남아 안 됨. asar:false로 평문 파일 제공.
# 터미널 데몬(node-pty)도 RUN_AS_NODE fork라 동일 이유로 asar 밖이라야 함.
asar: false

# Next standalone 서버(fork 대상)는 리소스로 동봉 → process.resourcesPath/standalone.
# (static·public은 빌드 스크립트가 standalone 안으로 복사해둠)
extraResources:
  - from: .next/standalone
    to: standalone
    filter:
      - "**/*"        # node_modules 포함 강제(기본 pruning 무력화)
      - ".next/**"    # dotdir(.next/서버청크·static) 명시 포함
      - "!**/*.map"
      - "!**/obj.target/**"  # 네이티브 빌드 중간산출물 — codesign이 .o에서 죽음(#975)
      - "!**/*.o"
  # 터미널 데몬(#682) — ELECTRON_RUN_AS_NODE 자식으로 fork되므로 asar 밖이라야 실행 가능
  # (RUN_AS_NODE는 asar 미지원 → asar 안 스크립트는 require 불가). resources/electron/에 동봉.
  - from: electron/terminal-daemon.cjs
    to: electron/terminal-daemon.cjs
  - from: electron/terminal-env.cjs      # #1226 데몬이 require — 빠지면 색 능력 env가 빠짐(데몬은 뜸, diff 줄 배경 안 보임)
    to: electron/terminal-env.cjs
  - from: electron/daemon-version.cjs   # #1036 데몬이 require — 빠지면 새 데몬이 켜자마자 죽음(실측)
    to: electron/daemon-version.cjs
  # #1358 채팅 AI 서버(SNA) 데몬 껍데기 — 터미널 데몬처럼 RUN_AS_NODE로 떼어 띄움(앱을 닫아도 채팅 작업 계속)
  - from: electron/sna-daemon-host.cjs
    to: electron/sna-daemon-host.cjs
  # 컴퓨터 사용 도우미(#1189) — 자기 번들 id를 가진 .app이라 macOS 권한이 이 도우미에 붙음. package-app.mjs가 먼저 만듦.
  - from: native/computer-use-macos/dist/Mustard Computer Use.app
    to: Mustard Computer Use.app
  # 받아쓰기 도우미(#1341) — Mustard 자식으로 실행돼 마이크·음성 인식 권한은 Mustard 이름으로(아래 extendInfo 설명 필요). package-app.mjs가 먼저 만듦.
  - from: native/dictation-macos/dist/mustard-dictate
    to: mustard-dictate
  # 로컬 음성 모델 엔진(#1341) — koffi가 dylib를 dlopen하므로 asar 밖 Resources/node_modules에(받아쓰기 일꾼이 여기서 찾음). 모델 파일은 받을 때만 내려받음.
  - from: electron/stt-worker.mjs
    to: electron/stt-worker.mjs
  - from: ../../node_modules/transcribe-cpp
    to: node_modules/transcribe-cpp
  - from: ../../node_modules/@transcribe-cpp/darwin-arm64-metal
    to: node_modules/@transcribe-cpp/darwin-arm64-metal
  - from: ../../node_modules/koffi
    to: node_modules/koffi
  - from: ../../node_modules/@koromix/koffi-darwin-arm64   # koffi 네이티브(.node) — 없으면 'Cannot find the native Koffi module'(실측)
    to: node_modules/@koromix/koffi-darwin-arm64
  # 데몬이 require("node-pty") 하는데, resources/electron/에서 walk-up 하면 resources/node_modules/node-pty를
  # 찾는다. from은 hoist된 루트 node_modules(apps/mustard/node_modules는 비어 있음, #906).
  # node-pty .node는 package-app.mjs가 패키징 전 electron ABI로 선빌드(RUN_AS_NODE 데몬서 로드).
  - from: ../../node_modules/node-pty
    to: node_modules/node-pty
    filter:
      - "**/*"
      - "!**/*.map"
      - "!**/obj.target/**"  # 컴파일 중간산출물 — 런타임은 build/Release/*.node만 필요, .o는 codesign 실패 유발(#975)
      - "!**/*.o"

# 네이티브 모듈(better-sqlite3)을 electron ABI로 rebuild.
npmRebuild: false  # 네이티브는 package-app.mjs가 electron ABI로 선빌드(#684). electron-builder가 127로 덮지 않게.

# extraResources가 strip한 standalone/node_modules를 패킹 후 복원.
afterPack: electron/after-pack.cjs

mac:
  category: public.app-category.developer-tools
  # #1341 받아쓰기 — 마이크 권한 표시(보안 강화 모드에선 필수, 자식 도우미도 같은 것) + 사용 설명(없으면 macOS가 도우미를 죽임)
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: "Mustard uses the microphone when you dictate a message to your agent."
    NSSpeechRecognitionUsageDescription: "Mustard turns your voice into text on this Mac when you dictate a message."
  target:
    - dir   # 빠른 로컬 검증용
    - dmg   # 배포물(미노터라이즈 — 서명/노터라이즈는 배포 임박 시)
